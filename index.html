<!DOCTYPE html>
<html lang="en" data-theme="dark" data-color-preset="neon-purple">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ANISTREAM - Your Anime Universe</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#9333ea">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root, :root[data-color-preset="neon-purple"] {
        /* Base Colors */
        --color-primary-hue: 265;
        --color-secondary-hue: 174;
        --color-tertiary-hue: 243;
        
        /* THEME: Neon Purple */
        --color-primary: 147 51 234; /* purple-600 */
        --color-primary-hover: 126 34 206; /* purple-700 */
        --color-primary-accent: 192 132 252; /* purple-400 */
        --color-secondary-accent: 13 148 136; /* teal-600 */
        --color-tertiary-accent: 79 70 229; /* indigo-600 */
        --shadow-color: 168 85 247; /* purple-500 */
        --logo-glow-1: #a855f7;
        --logo-glow-2: #c084fc;
      }
      
      :root[data-color-preset="indigo-flare"] {
        /* THEME: Indigo Flare */
        --color-primary: 79 70 229; /* indigo-600 */
        --color-primary-hover: 67 56 202; /* indigo-700 */
        --color-primary-accent: 129 140 248; /* indigo-400 */
        --color-secondary-accent: 16 185 129; /* emerald-500 */
        --color-tertiary-accent: 59 130 246; /* blue-500 */
        --shadow-color: 99 102 241; /* indigo-500 */
        --logo-glow-1: #6366f1;
        --logo-glow-2: #818cf8;
      }

      :root[data-color-preset="cyber-blue"] {
        /* THEME: Cyber Blue */
        --color-primary: 37 99 235; /* blue-600 */
        --color-primary-hover: 29 78 216; /* blue-700 */
        --color-primary-accent: 96 165 250; /* blue-400 */
        --color-secondary-accent: 22 163 74; /* green-600 */
        --color-tertiary-accent: 217 70 239; /* fuchsia-500 */
        --shadow-color: 59 130 246; /* blue-500 */
        --logo-glow-1: #3b82f6;
        --logo-glow-2: #60a5fa;
      }
      
      :root[data-color-preset="sunset-orange"] {
        /* THEME: Sunset Orange */
        --color-primary: 234 88 12; /* orange-600 */
        --color-primary-hover: 217 70 23; /* orange-700 */
        --color-primary-accent: 251 146 60; /* orange-400 */
        --color-secondary-accent: 220 38 38; /* red-600 */
        --color-tertiary-accent: 217 119 6; /* amber-500 */
        --shadow-color: 249 115 22; /* orange-500 */
        --logo-glow-1: #f97316;
        --logo-glow-2: #fb923c;
      }

      /* Dark Mode Palette */
      :root[data-theme="dark"] {
        --color-danger: 239 68 68;
        --color-warning: 251 191 36;
        --text-primary: 241 245 249;
        --text-secondary: 209 213 219;
        --text-muted: 156 163 175;
        --text-on-primary: 255 255 255;
        --text-on-accent: 243 232 255;
        --bg-gradient-start: 59 7 100;
        --bg-gradient-via: 15 23 42;
        --bg-gradient-end: 0 0 0;
        --surface-1: 15 23 42;
        --surface-2: 30 41 59;
        --surface-3: 51 65 85;
        --surface-4: 71 85 105;
        --surface-input: 51 65 85;
        --border-color: 51 65 85;
        --border-focus: var(--color-primary);
        --scrollbar-thumb: rgb(var(--color-primary-hover));
        --scrollbar-thumb-hover: rgb(var(--color-primary));
        --scrollbar-track: #0F172A;
      }
      
      /* Light Mode Palette (Ocean Blue) */
      :root[data-theme="light"] {
        --color-danger: 220 38 38; /* red-600 */
        --color-warning: 245 158 11; /* amber-500 */
        --text-primary: 30 41 59; /* slate-800 */
        --text-secondary: 51 65 85; /* slate-700 */
        --text-muted: 71 85 105; /* slate-600 */
        --text-on-primary: 255 255 255;
        --text-on-accent: 15 23 42;
        --bg-gradient-start: 177 241 247; /* light teal */
        --bg-gradient-via: 203 242 252; /* cyan-100 */
        --bg-gradient-end: 224 242 254; /* sky-100 */
        --surface-1: 255 255 255;
        --surface-2: 240 249 255; /* sky-50 */
        --surface-3: 224 242 254; /* sky-100 */
        --surface-4: 203 242 252; /* cyan-100 */
        --surface-input: 224 242 254;
        --border-color: 186 230 253; /* sky-200 */
        --border-focus: var(--color-primary);
        --scrollbar-thumb: rgb(var(--color-primary-hover));
        --scrollbar-thumb-hover: rgb(var(--color-primary));
        --scrollbar-track: #e0f2fe; /* sky-100 */

        /* Adjust logo glow for light mode */
        --logo-glow-1: transparent;
        --logo-glow-2: transparent;
      }

      /* Base Scrollbar */
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: var(--scrollbar-track); }
      ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-thumb-hover); }

      /* Global Transitions & Animations */
      html {
        scroll-behavior: smooth;
      }
      button, a, input[type="checkbox"], input[type="radio"], select {
        transition: all 0.2s ease-out;
      }
      @keyframes cinematic-fade-in {
        from { opacity: 0; filter: blur(5px); }
        to { opacity: 1; filter: blur(0px); }
      }
      .animate-cinematic-fade-in {
        animation: cinematic-fade-in 0.6s ease-out forwards;
      }
      @keyframes subtle-fade-in-up {
        from { opacity: 0; transform: translateY(10px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      .animate-subtle-fade-in-up {
        animation: subtle-fade-in-up 0.5s ease-out forwards;
      }
      @keyframes ken-burns-slow {
        0% { transform: scale(1) translate(0, 0); }
        100% { transform: scale(1.05) translate(-2%, 1%); }
      }
      .animate-ken-burns {
        animation: ken-burns-slow 20s ease-in-out infinite alternate;
      }
      @keyframes pulse-slow {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.01); }
      }
      .animate-pulse-slow {
        animation: pulse-slow 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      /* Desktop Layout & Scrollbar Enhancements */
      @media (min-width: 1024px) {
        .desktop-mode .player-grid-container {
          display: grid;
          grid-template-columns: 1fr 420px;
          gap: 1.5rem; /* gap-6 */
          align-items: start;
        }

        .desktop-mode .player-side-column {
          /* 80px for header, 48px for top padding */
          max-height: calc(100vh - 80px - 48px);
          overflow-y: auto;
          padding-right: 8px; /* Space for scrollbar */
        }

        /* WebKit scrollbar styling */
        .desktop-mode .player-side-column::-webkit-scrollbar {
          width: 8px;
        }
        .desktop-mode .player-side-column::-webkit-scrollbar-track {
          background: transparent;
        }
        .desktop-mode .player-side-column::-webkit-scrollbar-thumb {
          background-color: rgb(var(--surface-4));
          border-radius: 4px;
        }
        .desktop-mode .player-side-column::-webkit-scrollbar-thumb:hover {
          background-color: rgb(var(--surface-3));
        }

        /* Firefox scrollbar styling */
        .desktop-mode .player-side-column {
          scrollbar-width: thin;
          scrollbar-color: rgb(var(--surface-4)) transparent;
        }
      }

      /* Styles for when user forces desktop mode on smaller screens */
      .force-desktop-mode.desktop-mode .player-grid-container {
        grid-template-columns: 1fr 420px;
      }
      .force-desktop-mode.desktop-mode .player-grid-container {
        /* You could adjust the side column width for smaller forced views if needed */
        /* grid-template-columns: 1fr 320px; */
      }
      /* Preloader Styles */
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background-color: #0F172A; /* slate-900, matches dark theme via color */
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 1.5rem;
        color: white;
      }
      #preloader .logo {
        font-size: 2.25rem; /* text-4xl */
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #fff;
        text-shadow: 0 0 4px #fff, 0 0 8px #fff, 0 0 12px var(--logo-glow-1, #a855f7), 0 0 20px var(--logo-glow-1, #a855f7);
      }
      #preloader .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgb(51 65 85); /* border-slate-700 */
        border-top-color: #a855f7; /* purple-500 */
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(300deg); } }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.27.0"
  }
}
</script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
  <body>
    <div id="preloader">
      <div class="logo">ANISTREAM</div>
      <div class="spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js').then(registration => {
            console.log('ServiceWorker registration successful with scope: ', registration.scope);
          }, err => {
            console.log('ServiceWorker registration failed: ', err);
          });
        });
      }
    </script>
  </body>
</html>
