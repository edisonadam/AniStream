<!DOCTYPE html>
<html lang="en" data-theme="dark" data-color-preset="abyssal-blue" class="scroll-fade-container">
  <head>
    <meta charset="utf-t" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />

    <meta property="og:title" content="ANISTREAM - Your Anime Universe" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://anistream.example.com/" />
    <meta property="twitter:title" content="ANISTREAM - Your Anime Universe" />
    <meta property="twitter:description" content="A sleek and modern anime streaming-style website with a dark neon aesthetic, featuring a responsive layout, featured slideshow, anime grid, and interactive UI elements." />
    <meta property="twitter:image" content="/og-image.png" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/artplayer/dist/skin/default.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <style>
      :root, :root[data-color-preset="abyssal-blue"] {
        /* THEME: Abyssal Blue (Default) */
        --color-primary: 37 99 235; /* blue-600 */
        --color-primary-hover: 29 78 216; /* blue-700 */
        --color-primary-accent: 96 165 250; /* blue-400 */
        --color-secondary-accent: 34 211 238; /* cyan-400 */
        --color-tertiary-accent: 45 212 191; /* teal-400 */
        --shadow-color: 37 99 235; /* blue-600 */
        --logo-glow-1: #2563eb;
        --logo-glow-2: #60a5fa;
      }

      :root[data-color-preset="violet-fusion"] {
        /* THEME: Violet Fusion (inspired by miruro.to) */
        --color-primary: 139 92 246; /* violet-500 */
        --color-primary-hover: 124 58 237; /* violet-600 */
        --color-primary-accent: 167 139 250; /* violet-400 */
        --color-secondary-accent: 34 197 94; /* green-500 */
        --color-tertiary-accent: 234 179 8; /* yellow-500 */
        --shadow-color: 139 92 246; /* violet-500 */
        --logo-glow-1: #8b5cf6;
        --logo-glow-2: #a78bfa;
      }

      :root[data-color-preset="cyber-cyan"] {
        --color-primary: 14 165 233; /* sky-500 */
        --color-primary-hover: 8 145 178; /* cyan-600 */
        --color-primary-accent: 56 189 248; /* sky-400 */
        --color-secondary-accent: 16 185 129; /* emerald-500 */
        --color-tertiary-accent: 192 132 252; /* purple-400 */
        --shadow-color: 14 165 233; /* sky-500 */
        --logo-glow-1: #00ffff;
        --logo-glow-2: #38bdf8;
      }
      
      :root[data-color-preset="sunset-orange"] {
        --color-primary: 234 88 12; /* orange-600 */
        --color-primary-hover: 217 70 23; /* orange-700 */
        --color-primary-accent: 251 146 60; /* orange-400 */
        --color-secondary-accent: 220 38 38; /* red-600 */
        --color-tertiary-accent: 217 119 6; /* amber-500 */
        --shadow-color: 249 115 22; /* orange-500 */
        --logo-glow-1: #f97316;
        --logo-glow-2: #fb923c;
      }

      /* Rainbow Shift Animation */
      @keyframes rainbowShift {
        0%, 100% { /* Abyssal Blue */
          --color-primary: 37 99 235; --color-primary-hover: 29 78 216; --color-primary-accent: 96 165 250;
          --color-secondary-accent: 34 211 238; --color-tertiary-accent: 45 212 191; --shadow-color: 37 99 235;
          --logo-glow-1: #2563eb; --logo-glow-2: #60a5fa;
        }
        25% { /* Violet Fusion */
          --color-primary: 139 92 246; --color-primary-hover: 124 58 237; --color-primary-accent: 167 139 250;
          --color-secondary-accent: 34 197 94; --color-tertiary-accent: 234 179 8; --shadow-color: 139 92 246;
          --logo-glow-1: #8b5cf6; --logo-glow-2: #a78bfa;
        }
        50% { /* Cyber Cyan */
          --color-primary: 14 165 233; --color-primary-hover: 8 145 178; --color-primary-accent: 56 189 248;
          --color-secondary-accent: 16 185 129; --color-tertiary-accent: 192 132 252; --shadow-color: 14 165 233;
          --logo-glow-1: #00ffff; --logo-glow-2: #38bdf8;
        }
        75% { /* Sunset Orange */
          --color-primary: 234 88 12; --color-primary-hover: 217 70 23; --color-primary-accent: 251 146 60;
          --color-secondary-accent: 220 38 38; --color-tertiary-accent: 217 119 6; --shadow-color: 249 115 22;
          --logo-glow-1: #f97316; --logo-glow-2: #fb923c;
        }
      }
      html[data-color-preset="rainbow-shift"] {
        animation: rainbowShift 20s linear infinite;
      }

      /* Dark Mode Palette - Liquid Glass */
      :root[data-theme="dark"] {
        --color-danger: 239 68 68;
        --color-warning: 251 191 36;
        --text-primary: 229 231 235; /* gray-200 */
        --text-secondary: 209 213 219; /* gray-300 */
        --text-muted: 156 163 175; /* gray-400 */
        --text-on-primary: 255 255 255;
        --text-on-accent: 243 232 255;
        --bg-gradient-start: 13 13 13;
        --bg-gradient-via: 13 13 13;
        --bg-gradient-end: 13 13 13;
        --surface-1: 17 17 17; /* Darker base */
        --surface-2: 31 31 31; /* Glass BG */
        --surface-3: 41 41 41;
        --surface-4: 51 51 51;
        --surface-input: 31 41 55;
        --border-color: 55 65 81;
        --border-focus: var(--color-primary);
        --scrollbar-thumb: rgb(var(--color-primary-hover));
        --scrollbar-thumb-hover: rgb(var(--color-primary));
        --scrollbar-track: transparent;
      }
      
      /* Light Mode Palette (Ocean Blue) */
      :root[data-theme="light"] {
        --color-danger: 220 38 38; /* red-600 */
        --color-warning: 245 158 11; /* amber-500 */
        --text-primary: 30 41 59; /* slate-800 */
        --text-secondary: 51 65 85; /* slate-700 */
        --text-muted: 71 85 105; /* slate-600 */
        --text-on-primary: 255 255 255;
        --text-on-accent: 15 23 42;
        --bg-gradient-start: 177 241 247; /* light teal */
        --bg-gradient-via: 203 242 252; /* cyan-100 */
        --bg-gradient-end: 224 242 254; /* sky-100 */
        --surface-1: 255 255 255;
        --surface-2: 240 249 255; /* sky-50 */
        --surface-3: 224 242 254; /* sky-100 */
        --surface-4: 203 242 252; /* cyan-100 */
        --surface-input: 224 242 254;
        --border-color: 186 230 253; /* sky-200 */
        --border-focus: var(--color-primary);
        --scrollbar-thumb: rgb(var(--color-primary-hover));
        --scrollbar-thumb-hover: rgb(var(--color-primary));
        --scrollbar-track: transparent;
        --logo-glow-1: transparent;
        --logo-glow-2: transparent;
      }

      /* Fading Scrollbar (WebKit) */
      ::-webkit-scrollbar {
        width: 14px;
        height: 14px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background-color: transparent;
        border-radius: 6px;
        border: 4px solid transparent;
        background-clip: content-box;
        transition: background-color 0.3s ease;
      }
      
      /* Show scrollbar on hover or when scrolling */
      html.is-scrolling ::-webkit-scrollbar-thumb,
      body.is-scrolling ::-webkit-scrollbar-thumb,
      ::-webkit-scrollbar-thumb:hover,
      ::-webkit-scrollbar:hover ::-webkit-scrollbar-thumb {
        background-color: var(--scrollbar-thumb);
      }
      
      ::-webkit-scrollbar-thumb:hover {
        background-color: var(--scrollbar-thumb-hover);
      }

      /* Firefox Scrollbar */
      html { 
        scroll-behavior: smooth; 
        scrollbar-width: thin;
        scrollbar-color: transparent transparent;
        transition: scrollbar-color 0.3s ease;
      }
      
      html.is-scrolling,
      html:hover {
        scrollbar-color: var(--scrollbar-thumb) transparent;
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: rgb(var(--bg-gradient-start));
        position: relative;
        overflow-x: hidden;
        -webkit-user-select: none; /* Safari */
        -ms-user-select: none; /* IE 10+ */
        user-select: none; /* Standard syntax */
      }
      
      /* Mobile tap highlight removal */
      * {
        -webkit-tap-highlight-color: transparent;
      }
      
      /* Aurora Background Effect */
      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at 10% 20%, rgba(var(--color-primary), 0.15) 0%, transparent 30%),
                    radial-gradient(circle at 80% 90%, rgba(var(--color-secondary-accent), 0.1) 0%, transparent 40%);
        will-change: transform;
        z-index: -1;
        animation: aurora 20s linear infinite alternate;
      }
      
      @keyframes aurora {
        0% { transform: scale(1) rotate(0deg) translateY(0); }
        50% { transform: scale(1.2) rotate(180deg) translateY(-50px); }
        100% { transform: scale(1) rotate(360deg) translateY(0); }
      }
      
      /* New global transition for smooth theme changes */
      *, *::before, *::after {
        transition-property: color, background-color, border-color, text-shadow, box-shadow, fill, stroke, background;
        transition-duration: 0.8s;
        transition-timing-function: ease;
      }

      /* Global Transitions & Animations */
      button, a, input, select {
        transition: all 0.2s ease-out;
      }
      @keyframes cinematic-fade-in {
        from { opacity: 0; filter: blur(5px); }
        to { opacity: 1; filter: blur(0px); }
      }
      .animate-cinematic-fade-in {
        animation: cinematic-fade-in 0.8s ease-out forwards;
      }
      @keyframes subtle-fade-in-up {
        from { opacity: 0; transform: translateY(20px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      .animate-subtle-fade-in-up {
        animation: subtle-fade-in-up 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        animation-fill-mode: both;
      }
      @keyframes modal-pop-in {
        from { opacity: 0; transform: translateY(40px) scale(0.95); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      .animate-modal-pop-in {
        animation: modal-pop-in 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
      }
      @keyframes marquee {
        from { transform: translateX(0); }
        to { transform: translateX(-50%); }
      }
      @keyframes ken-burns-slow {
        0% { transform: scale(1) translate(0, 0); }
        100% { transform: scale(1.05) translate(-2%, 1%); }
      }
      .animate-ken-burns {
        animation: ken-burns-slow 20s ease-in-out infinite alternate;
      }
      @keyframes throb {
        0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(var(--color-primary), 0.7); }
        50% { transform: scale(1.1); box-shadow: 0 0 8px 3px rgba(var(--color-primary), 0); }
      }
      .animate-throb {
        animation: throb 1.5s ease-in-out infinite;
      }
      
      @keyframes flashy-red-glow {
          0%, 100% {
              box-shadow: 0 0 5px rgb(239 68 68 / 0.8), 0 0 0 0 rgba(239, 68, 68, 0.7);
          }
          50% {
              box-shadow: 0 0 10px rgb(239 68 68 / 0.8), 0 0 0 5px rgba(239, 68, 68, 0);
          }
      }
      .animate-flashy-red {
          animation: flashy-red-glow 1.5s infinite;
      }

      /* Player button press animation */
      .art-control:active, .floating-player-button:active {
        transform: scale(0.92) !important;
        transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1);
      }
      
      /* PiP Dragging Styles */
      body.pip-dragging { 
        pointer-events: none; 
        user-select: none;
      }
      .pip-handle {
        position: absolute;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        right: -14px;
        top: calc(50% - 14px);
        background: rgba(255,255,255,0.12);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: grab;
        user-select: none;
        box-shadow: 0 3px 10px rgba(0,0,0,0.25);
        pointer-events: all;
      }
      .pip-handle:active {
        cursor: grabbing;
      }
      .pip-handle::after {
        content: "";
        width: 10px;
        height: 10px;
        border-radius: 2px;
        background: rgba(255,255,255,0.85);
      }
      
      /* Preloader Styles */
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background-color: #0d0d0d;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 1.5rem;
        color: white;
      }
      #preloader .logo {
        font-size: 2.25rem;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #fff;
        animation: pulse-glow 2s ease-in-out infinite;
      }
      @keyframes pulse-glow {
        0%, 100% {
          text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 15px var(--logo-glow-1), 0 0 25px var(--logo-glow-1);
        }
        50% {
          text-shadow: 0 0 10px #fff, 0 0 20px var(--logo-glow-2), 0 0 30px var(--logo-glow-2), 0 0 45px var(--logo-glow-2);
        }
      }
      #preloader .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid transparent;
        border-top-color: var(--logo-glow-1, #8b5cf6);
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* Modal Zoom Effect */
      .main-content-wrapper {
        min-height: 100vh;
        background: rgb(var(--bg-gradient-start));
        transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), filter 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), border-radius 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        will-change: transform, filter;
      }
      body.modal-zoom-effect-active .main-content-wrapper {
        transform: scale(0.92);
        filter: blur(4px) brightness(0.7);
        pointer-events: none;
        border-radius: 2rem;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      }

      /* Player Focus Overlay Styles */
      body.player-focused-mode {
        overflow: hidden;
      }
      .player-focus-overlay {
        position: fixed;
        inset: 0;
        z-index: 9990; /* High, but below modals */
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        opacity: 0;
        transition: opacity .25s ease;
      }
      .player-focus-overlay.visible {
        pointer-events: auto;
        opacity: 1;
      }
      .player-focus-overlay-backdrop {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.86);
        backdrop-filter: blur(6px);
      }
      .player-focus-overlay-content {
        position: relative;
        z-index: 1;
        max-width: 1200px;
        width: calc(100% - 24px);
        margin: 0 12px;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        transform: translateY(8px) scale(.99);
        transition: transform .22s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity .22s ease;
        pointer-events: auto;
      }
      .player-focus-overlay.visible .player-focus-overlay-content {
        transform: translateY(0) scale(1);
      }
      .player-focus-overlay-close {
        position: absolute;
        top: -40px;
        right: 0;
        z-index: 3;
        background: rgba(31, 31, 31, 0.7);
        backdrop-filter: blur(5px);
        color: white;
        border: 1px solid rgba(255,255,255,0.1);
        width: 36px;
        height: 36px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
      }
       .player-focus-overlay-close:hover {
        background: rgb(var(--color-primary));
        transform: scale(1.1);
       }
      .player-focus-overlay-slot {
        width: 100%;
        background: black;
        min-height: 200px;
        border-radius: 14px; /* Match content radius */
      }


      /* Touch Hover Enhancement */
      .anime-card-touch-target.touch-hover {
        transform: scale(1.05);
        box-shadow: 0 25px 50px -12px rgba(var(--shadow-color), 0.4);
      }
      .anime-card-touch-target.touch-hover h3 {
        color: rgb(var(--color-primary-accent));
      }
      .anime-card-touch-target.touch-hover .watchlist-menu {
        opacity: 1;
      }
      .continue-watching-card-touch-target.touch-hover {
        transform: translateY(-0.25rem); /* -translate-y-1 */
      }
      .continue-watching-card-touch-target.touch-hover p:first-of-type { /* The title */
        color: rgb(var(--color-primary-accent));
      }
      .slideshow-card-touch-target.touch-hover > div {
        transform: translateY(-0.5rem) scale(1.03);
        box-shadow: 0 25px 50px -12px rgba(var(--shadow-color), 0.5);
      }
      .slideshow-card-touch-target.touch-hover h3 {
        color: rgb(var(--color-primary-accent));
      }
      .club-card-touch-target.touch-hover,
      .manga-card-touch-target.touch-hover {
        transform: translateY(-0.5rem);
        box-shadow: 0 25px 50px -12px rgba(var(--shadow-color), 0.5);
      }
      .club-card-touch-target.touch-hover h3,
      .manga-card-touch-target.touch-hover h3 {
        color: rgb(var(--color-primary-accent));
      }
      
      /* Pinch-to-zoom Player Style */
      .player-zoomed-to-fit {
        position: fixed !important;
        inset: 0 !important;
        z-index: 10000;
        width: 100vw !important;
        height: 100vh !important;
        max-width: none !important;
        max-height: none !important;
        border-radius: 0 !important;
        background-color: black;
      }
      .player-zoomed-to-fit .artplayer-video {
        object-fit: contain;
      }

      /* Lights Off / Theater Mode */
      body.lights-off-active {
        background: #000;
      }
      body.lights-off-active .player-wrapper-container {
        max-width: 100%;
        padding-left: 0;
        padding-right: 0;
      }
      body.lights-off-active .player-content-container {
        max-width: 1280px; /* lg breakpoint */
        margin: 0 auto;
      }
      body.lights-off-active .player-content-grid {
        display: block; /* Stack items vertically */
      }
      body.lights-off-active .player-sidebar-content {
        margin-top: 2rem;
      }
      body.lights-off-active .player-wrapper-container .artplayer-app {
        border-radius: 0;
        max-height: 100vh;
      }
      body.lights-off-active::after {
        content: none;
      }

      /* Horizontal Scrollbar Fade */
      .horizontal-scroll-fade::-webkit-scrollbar {
        height: 12px;
      }
      .horizontal-scroll-fade::-webkit-scrollbar-track {
        background: transparent;
      }
      .horizontal-scroll-fade::-webkit-scrollbar-thumb {
        background-color: transparent;
        border-radius: 6px;
        border: 3px solid transparent;
        background-clip: content-box;
        transition: background-color 0.3s ease;
      }
      .horizontal-scroll-fade:hover::-webkit-scrollbar-thumb {
        background-color: var(--scrollbar-thumb);
      }
      .horizontal-scroll-fade::-webkit-scrollbar-thumb:hover {
        background-color: var(--scrollbar-thumb-hover);
      }
      .horizontal-scroll-fade {
        scrollbar-width: thin;
        scrollbar-color: transparent transparent;
        transition: scrollbar-color 0.3s ease;
        overscroll-behavior-x: contain;
      }
      .horizontal-scroll-fade:hover {
        scrollbar-color: var(--scrollbar-thumb) transparent;
      }

      /* Skip Intro/Outro markers */
      .skip-marker {
        position: absolute;
        height: 100%;
        background-color: rgba(var(--color-primary), 0.5); /* Theme colored */
        opacity: 0.6; /* Always visible but semi-transparent */
        z-index: 10;
        pointer-events: none;
        top: 0;
        border-radius: 2px;
        box-shadow: 0 0 4px rgba(var(--color-primary), 0.5);
        transition: opacity 0.3s, background-color 0.3s;
        will-change: left, width;
      }
      .skip-marker:hover,
      .artplayer-app:hover .art-control-progress .skip-marker {
        opacity: 1;
        background-color: rgb(var(--color-primary));
      }

      /* New Episode Badge */
      @keyframes pulse-dot {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.5); opacity: 0.3; }
      }
      .new-episode-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.375rem; /* gap-1.5 */
        border-radius: 9999px; /* rounded-full */
        font-weight: 700; /* font-bold */
        color: white;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        background-image: linear-gradient(to right, rgb(239 68 68 / 0.8), rgb(220 38 38 / 0.8));
        backdrop-filter: blur(4px);
        border: 1px solid rgb(255 255 255 / 0.1);
        box-shadow: 0 2px 8px rgb(0 0 0 / 0.3);
      }
      .new-episode-badge .pulse-dot {
        width: 0.5rem; /* w-2 */
        height: 0.5rem; /* h-2 */
        border-radius: 9999px;
        background-color: rgb(255 255 255 / 0.9);
        animation: pulse-dot 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
    </style>
<script type="importmap">
{
  "imports": {
    "artplayer": "https://aistudiocdn.com/artplayer@^5.3.0",
    "vite": "https://aistudiocdn.com/vite@^7.2.2",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom": "https://aistudiocdn.com/react-dom@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
