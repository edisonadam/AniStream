<!DOCTYPE html>
<html lang="en" data-theme="dark" data-color-preset="abyssal-blue">
  <head>
    <meta charset="UTF-g" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ANISTREAM - Your Anime Universe</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#8b5cf6">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root, :root[data-color-preset="abyssal-blue"] {
        /* THEME: Abyssal Blue (Default) */
        --color-primary: 37 99 235; /* blue-600 */
        --color-primary-hover: 29 78 216; /* blue-700 */
        --color-primary-accent: 96 165 250; /* blue-400 */
        --color-secondary-accent: 34 211 238; /* cyan-400 */
        --color-tertiary-accent: 45 212 191; /* teal-400 */
        --shadow-color: 37 99 235; /* blue-600 */
        --logo-glow-1: #2563eb;
        --logo-glow-2: #60a5fa;
      }

      :root[data-color-preset="violet-fusion"] {
        /* THEME: Violet Fusion (inspired by miruro.to) */
        --color-primary: 139 92 246; /* violet-500 */
        --color-primary-hover: 124 58 237; /* violet-600 */
        --color-primary-accent: 167 139 250; /* violet-400 */
        --color-secondary-accent: 34 197 94; /* green-500 */
        --color-tertiary-accent: 234 179 8; /* yellow-500 */
        --shadow-color: 139 92 246; /* violet-500 */
        --logo-glow-1: #8b5cf6;
        --logo-glow-2: #a78bfa;
      }

      :root[data-color-preset="cyber-cyan"] {
        --color-primary: 14 165 233; /* sky-500 */
        --color-primary-hover: 8 145 178; /* cyan-600 */
        --color-primary-accent: 56 189 248; /* sky-400 */
        --color-secondary-accent: 16 185 129; /* emerald-500 */
        --color-tertiary-accent: 192 132 252; /* purple-400 */
        --shadow-color: 14 165 233; /* sky-500 */
        --logo-glow-1: #00ffff;
        --logo-glow-2: #38bdf8;
      }
      
      :root[data-color-preset="sunset-orange"] {
        --color-primary: 234 88 12; /* orange-600 */
        --color-primary-hover: 217 70 23; /* orange-700 */
        --color-primary-accent: 251 146 60; /* orange-400 */
        --color-secondary-accent: 220 38 38; /* red-600 */
        --color-tertiary-accent: 217 119 6; /* amber-500 */
        --shadow-color: 249 115 22; /* orange-500 */
        --logo-glow-1: #f97316;
        --logo-glow-2: #fb923c;
      }

      /* Dark Mode Palette - Liquid Glass */
      :root[data-theme="dark"] {
        --color-danger: 239 68 68;
        --color-warning: 251 191 36;
        --text-primary: 229 231 235; /* gray-200 */
        --text-secondary: 209 213 219; /* gray-300 */
        --text-muted: 156 163 175; /* gray-400 */
        --text-on-primary: 255 255 255;
        --text-on-accent: 243 232 255;
        --bg-gradient-start: 13 13 13;
        --bg-gradient-via: 13 13 13;
        --bg-gradient-end: 13 13 13;
        --surface-1: 17 17 17; /* Darker base */
        --surface-2: 31 31 31; /* Glass BG */
        --surface-3: 41 41 41;
        --surface-4: 51 51 51;
        --surface-input: 31 41 55;
        --border-color: 55 65 81;
        --border-focus: var(--color-primary);
        --scrollbar-thumb: rgb(var(--color-primary-hover));
        --scrollbar-thumb-hover: rgb(var(--color-primary));
        --scrollbar-track: #0A0A0F;
      }
      
      /* Light Mode Palette (Ocean Blue) */
      :root[data-theme="light"] {
        --color-danger: 220 38 38; /* red-600 */
        --color-warning: 245 158 11; /* amber-500 */
        --text-primary: 30 41 59; /* slate-800 */
        --text-secondary: 51 65 85; /* slate-700 */
        --text-muted: 71 85 105; /* slate-600 */
        --text-on-primary: 255 255 255;
        --text-on-accent: 15 23 42;
        --bg-gradient-start: 177 241 247; /* light teal */
        --bg-gradient-via: 203 242 252; /* cyan-100 */
        --bg-gradient-end: 224 242 254; /* sky-100 */
        --surface-1: 255 255 255;
        --surface-2: 240 249 255; /* sky-50 */
        --surface-3: 224 242 254; /* sky-100 */
        --surface-4: 203 242 252; /* cyan-100 */
        --surface-input: 224 242 254;
        --border-color: 186 230 253; /* sky-200 */
        --border-focus: var(--color-primary);
        --scrollbar-thumb: rgb(var(--color-primary-hover));
        --scrollbar-thumb-hover: rgb(var(--color-primary));
        --scrollbar-track: #e0f2fe; /* sky-100 */
        --logo-glow-1: transparent;
        --logo-glow-2: transparent;
      }

      /* Base Scrollbar */
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: var(--scrollbar-track); }
      ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-thumb-hover); }

      html { scroll-behavior: smooth; }
      body {
        font-family: 'Inter', sans-serif;
        background-color: rgb(var(--bg-gradient-start));
        position: relative;
        overflow-x: hidden;
      }
      
      /* Aurora Background Effect */
      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: radial-gradient(circle at 10% 20%, rgba(var(--color-primary), 0.15) 0%, transparent 30%),
                    radial-gradient(circle at 80% 90%, rgba(var(--color-secondary-accent), 0.1) 0%, transparent 40%);
        will-change: transform;
        z-index: -1;
        animation: aurora 20s linear infinite alternate;
      }
      
      @keyframes aurora {
        0% { transform: scale(1) rotate(0deg) translateY(0); }
        50% { transform: scale(1.2) rotate(180deg) translateY(-50px); }
        100% { transform: scale(1) rotate(360deg) translateY(0); }
      }
      
      /* Global Transitions & Animations */
      button, a, input, select {
        transition: all 0.2s ease-out;
      }
      @keyframes cinematic-fade-in {
        from { opacity: 0; filter: blur(5px); }
        to { opacity: 1; filter: blur(0px); }
      }
      .animate-cinematic-fade-in {
        animation: cinematic-fade-in 0.8s ease-out forwards;
      }
      @keyframes subtle-fade-in-up {
        from { opacity: 0; transform: translateY(20px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      .animate-subtle-fade-in-up {
        animation: subtle-fade-in-up 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        animation-fill-mode: both;
      }
      @keyframes ken-burns-slow {
        0% { transform: scale(1) translate(0, 0); }
        100% { transform: scale(1.05) translate(-2%, 1%); }
      }
      .animate-ken-burns {
        animation: ken-burns-slow 20s ease-in-out infinite alternate;
      }
      
      /* Preloader Styles */
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background-color: #0d0d0d;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 1.5rem;
        color: white;
      }
      #preloader .logo {
        font-size: 2.25rem;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #fff;
        text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 15px var(--logo-glow-1, #8b5cf6), 0 0 25px var(--logo-glow-1, #8b5cf6);
      }
      #preloader .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgb(var(--border-color));
        border-top-color: var(--logo-glow-1, #8b5cf6);
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* Touch Hover Enhancement */
      .anime-card-touch-target.touch-hover {
        transform: scale(1.05);
        box-shadow: 0 25px 50px -12px rgba(var(--shadow-color), 0.4);
      }
      .anime-card-touch-target.touch-hover h3 {
        color: rgb(var(--color-primary-accent));
      }
      .anime-card-touch-target.touch-hover .watchlist-menu {
        opacity: 1;
      }
      .continue-watching-card-touch-target.touch-hover {
        transform: translateY(-0.25rem); /* -translate-y-1 */
      }
      .continue-watching-card-touch-target.touch-hover p:first-of-type { /* The title */
        color: rgb(var(--color-primary-accent));
      }
      .slideshow-card-touch-target.touch-hover > div {
        transform: translateY(-0.5rem) scale(1.03);
        box-shadow: 0 25px 50px -12px rgba(var(--shadow-color), 0.5);
      }
      .slideshow-card-touch-target.touch-hover h3 {
        color: rgb(var(--color-primary-accent));
      }
      .club-card-touch-target.touch-hover,
      .manga-card-touch-target.touch-hover {
        transform: translateY(-0.5rem);
        box-shadow: 0 25px 50px -12px rgba(var(--shadow-color), 0.5);
      }
      .club-card-touch-target.touch-hover h3,
      .manga-card-touch-target.touch-hover h3 {
        color: rgb(var(--color-primary-accent));
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.27.0",
    "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
    "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
    "firebase/": "https://aistudiocdn.com/firebase@^12.5.0/"
  }
}
</script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
  <body>
    <div id="preloader">
      <div class="logo">ANISTREAM</div>
      <div class="spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js').then(registration => {
            console.log('ServiceWorker registration successful with scope: ', registration.scope);
          }, err => {
            console.log('ServiceWorker registration failed: ', err);
          });
        });
      }
    </script>
  </body>
</html>
